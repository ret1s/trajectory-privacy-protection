   <g id="text_1">
    <text style="fill: #243b45; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="28.683" y="23.832" transform="rotate(-0 28.683 23.832)">THIẾT BỊ: giữ vị trí thật và trạng thái riêng</text>
   </g>
   <g id="text_2">
    <text style="fill: #243b45; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="485.964" y="23.832" transform="rotate(-0 485.964 23.832)">MÁY CHỦ LBS</text>
   </g>
   <g id="text_3">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="86.994" y="63.713999" transform="rotate(-0 86.994 63.713999)">1. Đầu vào</text>
   </g>
   <g id="text_4">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(49.889391 79.498501)">GPS xₜ, thời gian</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(49.343063 92.444438)">nhu cầu POI thật</text>
   </g>
   <g id="text_5">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="240.444" y="63.874936" transform="rotate(-0 240.444 63.874936)">2. Neo riêng tư</text>
   </g>
   <g id="text_6">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(194.582672 79.585688)">Test nhiễu / tái dùng</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(199.97775 93.067407)">sổ ngân sách B, H</text>
   </g>
   <g id="text_7">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="390.825" y="63.892124" transform="rotate(-0 390.825 63.892124)">3. Bộ lọc</text>
   </g>
   <g id="text_8">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(352.423828 80.006509)">Dừng / di chuyển</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(338.790234 92.477837)">belief từ neo đã bảo vệ</text>
   </g>
   <g id="text_9">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="390.825" y="158.463375" transform="rotate(-0 390.825 158.463375)">4. Chọn K điểm</text>
   </g>
   <g id="text_10">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(341.653359 174.723872)">Miền tới được trên làn</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(343.893516 188.20559)">phủ POI + thay điểm</text>
   </g>
   <g id="text_11">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="240.444" y="158.446188" transform="rotate(-0 240.444 158.446188)">5. Cổng biên</text>
   </g>
   <g id="text_12">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(204.586031 174.857817)">S9/S10: đề xuất</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(194.402672 187.527426)">chưa tích hợp model</text>
   </g>
   <g id="text_13">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="547.344" y="158.255563" transform="rotate(-0 547.344 158.255563)">6. Truy hồi</text>
   </g>
   <g id="text_14">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(513.347906 174.935864)">K vị trí công bố</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(509.933531 188.217192)">các loại truy vấn</text>
   </g>
   <g id="text_15">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="314.1" y="257.182699" transform="rotate(-0 314.1 257.182699)">7. Gộp / loại trùng / xếp hạng tại máy</text>
   </g>
   <g id="text_16">
    <text style="font: 9px 'DejaVu Sans'; text-anchor: middle" x="314.1" y="279.173373" transform="rotate(-0 314.1 279.173373)">Dùng vị trí thật để chọn top-5; không gửi bước lọc</text>
   </g>
   <g id="text_17">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: middle" x="86.994" y="158.096188" transform="rotate(-0 86.994 158.096188)">Ngữ cảnh công khai</text>
   </g>
